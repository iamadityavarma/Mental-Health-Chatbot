name: Model Training Pipeline

on:
  workflow_dispatch:
    inputs:
      dataset_name:
        description: 'Dataset to use for training'
        required: true
        default: 'Amod/mental_health_counseling_conversations'
      model_name:
        description: 'Base model to fine-tune'
        required: true
        default: 'meta-llama/Llama-3.2-1B-Instruct'
      epochs:
        description: 'Number of training epochs'
        required: true
        default: '3'

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-training-${{ hashFiles('notebooks/requirements.txt') }}

    - name: Install training dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers datasets accelerate peft evaluate mlflow
        pip install jupyter nbconvert

    - name: Run training notebook
      env:
        HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        MLFLOW_TRACKING_URI: "file:./mlruns"
      run: |
        cd notebooks
        jupyter nbconvert --to script training.ipynb
        python training.py
        
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model-${{ github.run_number }}
        path: |
          outputs-*/
          mlruns/
        retention-days: 30

    - name: Upload to Hugging Face (if token provided)
      if: env.HF_TOKEN != ''
      run: |
        echo "Uploading model to Hugging Face Hub"
        # Add HF upload logic here

  evaluate-model:
    needs: train-model
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-model-${{ github.run_number }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install evaluation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers datasets evaluate mlflow jupyter nbconvert

    - name: Run evaluation notebook
      run: |
        cd notebooks
        jupyter nbconvert --to script model_evaluation.ipynb
        python model_evaluation.py

    - name: Upload evaluation results
      uses: actions/upload-artifact@v3
      with:
        name: evaluation-results-${{ github.run_number }}
        path: |
          evaluation-results/
          mlruns/
        retention-days: 30

  create-release:
    needs: [train-model, evaluate-model]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Create model release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: model-v${{ github.run_number }}
        release_name: TheraBot Model v${{ github.run_number }}
        body: |
          Automated model training release
          
          Training Parameters:
          - Dataset: ${{ github.event.inputs.dataset_name }}
          - Base Model: ${{ github.event.inputs.model_name }}
          - Epochs: ${{ github.event.inputs.epochs }}
          
          See artifacts for trained model and evaluation results.
        draft: false
        prerelease: false